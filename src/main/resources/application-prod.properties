
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=https://topics-api-rest.vault.azure.net/

spring.datasource.url=jdbc:mysql://${DB-HOST}:${DB-PORT}/${DB-NAME}?useSSL=true&requireSSL=true
spring.datasource.username=${DB-USER}
spring.datasource.password=${DB-PASSWORD}

spring.jpa.show-sql = false
spring.jpa.properties.hibernate.format_sql = false

server.error.include-stacktrace = never

api.security.token.secret = ${API-KEY}